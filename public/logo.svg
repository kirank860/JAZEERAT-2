<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .brand { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 900; }
      .sub { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 800; }
      .sub2 { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 700; }
    </style>
  </defs>

  <g transform="translate(0, -20)">
    <!-- Red Roof Bars -->
    <!-- Top Bar -->
    <path d="M 330 180 L 590 80 L 590 110 L 330 210 Z" fill="#E31818" />
    
    <!-- Bottom Bar (Starts further left, ends earlier) -->
    <path d="M 210 260 L 300 260 L 460 200 L 370 200 Z" fill="#E31818" />
    <path d="M 210 260 L 290 260 L 500 180 L 420 180 Z" fill="#E31818" />
    
    <!-- Actually, let's make the lines use horizontal cuts as in typical construction logos -->
    <!-- Top Bar -->
    <polygon points="350,150 430,150 630,70 550,70" fill="#E31818" />
    
    <!-- Bottom Bar -->
    <polygon points="210,240 290,240 500,155 420,155" fill="#E31818" />

    <!-- Three Grey Squares next to the bottom bar -->
    <rect x="520" y="160" width="18" height="25" fill="#999999" />
    <rect x="545" y="160" width="18" height="25" fill="#999999" />
    <rect x="570" y="160" width="18" height="25" fill="#999999" />

    <!-- JAH Text -->
    <text x="305" y="270" class="brand" font-size="150" text-anchor="middle" fill="#000000">J</text>
    <text x="390" y="250" class="brand" font-size="150" text-anchor="middle" fill="#000000">A</text>
    <text x="490" y="250" class="brand" font-size="150" text-anchor="middle" fill="#000000">H</text>

    <!-- Sub Texts -->
    <text x="400" y="330" class="sub" font-size="36" text-anchor="middle" fill="#000000" letter-spacing="1.5">JAZEERAT AL HADEED</text>
    <text x="400" y="375" class="sub2" font-size="24" text-anchor="middle" fill="#000000">Metalic Cont Ind LLC</text>
  </g>
</svg>
